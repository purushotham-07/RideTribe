server.port=${PORT:8080}

# Database Configuration: Defaults to in-memory H2 for zero-config local run,
# switches automatically to PostgreSQL when SPRING_DATASOURCE_URL is provided (e.g. on Render).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ridetribedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Console (available locally at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security
ridetribe.jwt.secret=${JWT_SECRET:RideTribeSecretKeyForWeekendGroupRideMatcherBangalore2026SecureKeyWithAtLeast256Bits}
ridetribe.jwt.expirationMs=86400000

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Logging
logging.level.com.ridetribe=INFO
logging.level.org.springframework.web.socket=INFO
