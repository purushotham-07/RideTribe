server.port=${PORT:8080}

# MongoDB Configuration
# Local default: mongodb://localhost:27017/ridetribedb
# Production: set SPRING_DATA_MONGODB_URI (e.g. MongoDB Atlas connection string)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ridetribedb}
spring.data.mongodb.auto-index-creation=true

# JWT Security
ridetribe.jwt.secret=${JWT_SECRET:RideTribeSecretKeyForWeekendGroupRideMatcherBangalore2026SecureKeyWithAtLeast256Bits}
ridetribe.jwt.expirationMs=86400000

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:a4cbqfux}
cloudinary.api-key=${CLOUDINARY_API_KEY:744165893855797}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:icGh4CYyIxXrxodxNdcoa5X9hP8}

# Logging
logging.level.com.ridetribe=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.web.socket=INFO
